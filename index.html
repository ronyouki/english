<style>
/* Layout: single reading column, sticky player bar on top, each sentence is a row that lights up while spoken */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#1d2733; --muted:#5d6b7b; --line:#d5dce5;
  --accent:#2f5d8a; --hl:#fff1b8; --hl-edge:#e0a800; --pill:#e3ebf4;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a22; --surface:#1c242f; --fg:#e4e9f0; --muted:#98a6b6; --line:#2c3846;
  --accent:#8dbbe8; --hl:#4a3f12; --hl-edge:#f0c23a; --pill:#26344a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a22; --surface:#1c242f; --fg:#e4e9f0; --muted:#98a6b6; --line:#2c3846;
  --accent:#8dbbe8; --hl:#4a3f12; --hl-edge:#f0c23a; --pill:#26344a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:28px 12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-size:clamp(24px,5vw,32px);margin:4px 0 6px;text-wrap:balance;line-height:1.3}
.lead{color:var(--muted);font-size:14px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-block:12px}
.btns{display:flex;gap:6px}
button,select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700;min-width:96px}
button:focus-visible,select:focus-visible,.s:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ctl select{padding:6px 8px;min-height:36px;max-width:180px}
.status{flex-basis:100%;font-size:12px;color:var(--muted);min-height:1.4em}
.s{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:14px 16px;margin-block:12px;cursor:pointer;transition:background .2s,border-color .2s}
.s.on{background:var(--hl);border-left-color:var(--hl-edge)}
.s .num{font-size:11px;color:var(--muted);letter-spacing:.08em}
.en{font-family:var(--serif);font-size:clamp(18px,3.6vw,22px);line-height:1.55;margin:2px 0 6px}
.en b{font-weight:700;color:var(--accent);background:var(--pill);border-radius:4px;padding:0 3px}
.ipa{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.kana{font-size:15px;overflow-wrap:anywhere;margin-top:2px}
.ja{font-size:13px;color:var(--muted);margin-top:6px}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--accent)}
details ul{margin:6px 0 0;padding-left:1.2em}
.note{font-size:13px;color:var(--muted);margin-top:28px}
.warn{background:var(--pill);border-radius:8px;padding:8px 12px;font-size:13px;margin-block:8px}
@media (prefers-reduced-motion:reduce){.s{transition:none}}
</style>

const W=[
["問い: 英語で強く読まれる語と、弱く読まれる語はどう分かれる?","答え: 内容語(名詞・動詞・形容詞)は強く、機能語(前置詞・代名詞・助動詞・冠詞・接続詞)は弱く読まれる。<br>解説: 英語は強い音が一定のリズムで並ぶ言語。強い音の間にある機能語は短い時間に詰め込まれるので、母音が /ə/ に弱まる。<br>例: for → /fɚ/(go <b>for a</b> run → ゴ ファラ ラン)、can → /kən/(<b>can</b> turn → クン ターン)、of → /əv/(<b>box of</b> → バクサヴ)"],
["問い: t と d が消えたり、ラ行のように聞こえるのはなぜ?","答え: 舌先を強く動かす量を減らすため。<br>解説: 母音にはさまれた t/d は舌先で軽くはじくだけの flap /ɾ/ になる。n や別の t/d の隣では、破裂させずに止めるだけ、またはまとめて一つにする。<br>例: got up → ガラッ、want to → ワナ、sat down → サッ ダウン、best days → ベス デイズ"],
["問い: him, her, he, had, have の h が消えるのはなぜ?","答え: h は息だけの弱い音で、機能語の頭では前の語につなげた方が速く言えるから。<br>解説: 文頭や強調したときは h を発音する。文中の弱い位置では落ちて、前の語の子音とつながる。<br>例: sent it to <b>him</b> → センディッタ イム、and <b>he</b> → ナ ニ、the rain <b>had</b> → ダ レイナド"],

const au=$("au");
const T=[0,5.89,11.21,17.89,22.54,28.12,32.63,38.57,42.16,48.88]; // 各文の開始秒
const END=[4.94,10.24,16.92,21.58,27.16,31.99,37.61,41.54,47.9,53.07];
let idx=-1;
function mark(i,scroll){
  document.querySelectorAll(".s.on").forEach(e=>e.classList.remove("on"));
  if(i<0)return;
  const el=$("s"+i);el.classList.add("on");
  if(scroll)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
function cur(t){
  for(let i=T.length-1;i>=0;i--){if(t>=T[i]-0.08)return i}
  return 0;
}
function setUI(){
  const p=!au.paused&&!au.ended;
  $("play").textContent=p?"⏸ 一時停止":"▶ 再生";
  $("status").textContent=p?("再生中: 文 "+(idx+1)+" / "+S.length):(idx>=0?"一時停止中: 文 "+(idx+1)+" / "+S.length:"");
}
function seek(i){au.currentTime=T[i];idx=i;mark(i,true)}
function playFrom(i){seek(i);au.play().catch(()=>{});}
au.addEventListener("timeupdate",()=>{
  if(au.paused&&!au.seeking&&au.currentTime===0)return;
  const i=cur(au.currentTime);
  if(i!==idx){idx=i;mark(i,!au.paused);setUI()}
});
au.addEventListener("play",setUI);
au.addEventListener("pause",setUI);
au.addEventListener("ended",()=>{
  if($("loop").checked){au.currentTime=0;au.play()}
  else{idx=-1;mark(-1);setUI();$("status").textContent="再生終了"}
});
au.addEventListener("error",()=>{$("status").textContent="音声を読み込めませんでした"});
$("play").onclick=()=>{
  if(au.paused){if(au.ended||idx<0){au.currentTime=0}au.play().catch(()=>{$("status").textContent="再生できませんでした。もう一度タップしてください"})}
  else au.pause();
};
$("stop").onclick=()=>{au.pause();au.currentTime=0;idx=-1;mark(-1);setUI();$("status").textContent=""};
$("prev").onclick=()=>{const t=cur(au.currentTime);const i=(au.currentTime-T[t]>1.5)?t:Math.max(0,t-1);seek(i)};
$("next").onclick=()=>{seek(Math.min(S.length-1,cur(au.currentTime)+1))};
$("rate").onchange=()=>{au.playbackRate=parseFloat($("rate").value)};
addEventListener("pagehide",()=>au.pause());
</script>
